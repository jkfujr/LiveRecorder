name: Build
run-name: Build

on:
  workflow_dispatch:
  push:
    paths-ignore:
      - 'README.md'
      - '.github/**'
    tags:
      - 'v*'

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            static_tag: ""
          - os: macos-latest
            static_tag: ""
          - os: ubuntu-latest
            static_tag: "_Static"
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip3 install pyinstaller wheel
          pip3 install .

      - name: Pyinstaller build
        run: |
          pyinstaller build.spec
          cp config.sample.json dist/

      - name: Install staticx (Ubuntu only)
        if: matrix.os == 'ubuntu-latest'
        run: |
          pip install staticx
          sudo apt-get update
          sudo apt-get install -y patchelf

      - name: Create static binary (Ubuntu only)
        if: matrix.os == 'ubuntu-latest'
        run: |
          staticx dist/LiveRecorder dist/LiveRecorder-static
          mv dist/LiveRecorder-static dist/LiveRecorder

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: LiveRecorder_${{ runner.os }}${{ matrix.static_tag }}_${{ github.ref_name }}
          path: dist/
          compression-level: 6
          retention-days: 90

      - name: Create archive
        if: startsWith(github.ref_name, 'v')
        uses: thedoctor0/zip-release@main
        with:
          filename: LiveRecorder_${{ runner.os }}${{ matrix.static_tag }}_${{ github.ref_name }}.zip
          directory: dist/
          path: |
            LiveRecorder*
            config.sample.json

      - name: Release
        if: startsWith(github.ref_name, 'v')
        uses: ncipollo/release-action@v1
        with:
          artifacts: dist/LiveRecorder*.zip
          allowUpdates: true
          draft: true
          generateReleaseNotes: true
